name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: citycare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: "5000"
      BACKEND_URL: http://localhost:5000
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:test@localhost:5432/citycare_test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/citycare_test
      REDIS_URL: redis://localhost:6379
      # CI-only dummies. Real secrets live in the deployment environment.
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret
      OTP_SECRET: ci-otp-secret-ci-otp-secret-ci-otp-secret-ci-otp
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: "10"
      EMAIL_FROM: CityCare <no-reply@citycare.com>
      ADMIN_EMAIL: admin@citycare.com
      ADMIN_PASSWORD: Admin@12345
      SUPER_ADMIN_EMAIL: admin@citycare.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run test:coverage
      - run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm run build
